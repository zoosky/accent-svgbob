# cargo-deny configuration. CI runs `cargo deny check advisories licenses`
# (.github/workflows/ci.yml); bans and sources are not gated yet.

[advisories]
version = 2
# "warn" and not "deny": an upstream yank of a crate already pinned in
# Cargo.lock is a routine event and should not block unrelated PRs.
yanked = "warn"
# Gate unmaintained advisories on direct dependencies only; a transitive
# crate three levels down (e.g. paste via nalgebra's macro stack) is not
# actionable here.
unmaintained = "workspace"

[licenses]
version = 2
# The permissive set the dependency tree actually uses. Extend
# deliberately; a copyleft license showing up here should be a decision,
# not a default.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
