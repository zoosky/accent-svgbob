name: "Build"

# Manual only: the workflow still uses actions/upload-artifact@v3, which
# GitHub fails at job setup since 2024-11, so running it on every push
# just produced a guaranteed red check. Modernizing the release pipeline
# is its own task; trigger it by hand if a build matrix run is needed.
on: [workflow_dispatch]

jobs:
  build:
    runs-on: '${{ matrix.os }}'
    name: "Build ${{ matrix.target }}"
    strategy:
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   suffix: ""

    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: '${{ runner.os }}-cargo-registry-${{ hashFiles(''**/Cargo.lock'') }}'
      - uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: '${{ runner.os }}-cargo-index-${{ hashFiles(''**/Cargo.lock'') }}'
      - uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install nightly
        uses: actions-rs/toolchain@v1
        with:
            toolchain: nightly
            override: true
            target: ${{ matrix.target }}

      - name: Run cargo build --release
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release

      - name: Archive Binaries
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.target }}
          path: ./target/release/svgbob${{ matrix.suffix}}
